name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install -r scripts/requirements-format.txt
      - name: C++ style
        run: clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp tests/*.h
      - name: Python style
        run: black --check scripts
      - name: Frozen fixtures and source consistency
        run: python scripts/check-source.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
