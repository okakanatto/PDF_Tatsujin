name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Publication checks
        run: python scripts/check-publication.py
      - name: Publication checker tests
        run: python scripts/test-publication.py
      - name: Install pinned formatter
        run: python -m pip install -r scripts/requirements-format.txt
      - name: C++ style
        run: clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp tests/*.h
      - name: Python style
        run: black --check scripts
      - name: Frozen fixtures and source consistency
        run: python scripts/check-source.py
      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
